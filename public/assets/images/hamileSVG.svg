<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hamile Engineering</title>
  <desc id="desc">Hamile Engineering logo with a house outline, abstract hammer, and wordmark in navy and orange.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- House silhouette and roof -->
  <path d="M330 430 L800 105 L1270 430" fill="none" stroke="#1e3a5f" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M430 410 L800 155 L1170 410" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M420 405 V590 H1180 V405" fill="none" stroke="#1e3a5f" stroke-width="30" stroke-linejoin="miter"/>

  <!-- Abstract hammer integrated into the house -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 285 L905 475" stroke="#1e3a5f" stroke-width="48"/>
    <path d="M665 260 L735 190 L840 295 L770 365 Z" fill="#1e3a5f" stroke="none"/>
    <path d="M635 225 L700 160 L760 220 L695 285 Z" fill="url(#accent)" stroke="none"/>
    <path d="M760 365 L905 500" stroke="#f97316" stroke-width="12"/>
  </g>

  <!-- Window -->
  <rect x="748" y="440" width="104" height="104" fill="none" stroke="#f97316" stroke-width="13"/>
  <path d="M800 440 V544 M748 492 H852" stroke="#f97316" stroke-width="10"/>

  <!-- Ground / craftsmanship stroke -->
  <path d="M250 625 Q800 540 1350 625" fill="none" stroke="#f97316" stroke-width="13" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="800" y="790" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-size="150" font-weight="800" letter-spacing="8" fill="#1a1a2e">HAMILE</text>
  <path d="M420 845 H590 M1010 845 H1180" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="800" y="870" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-size="54" font-weight="600" letter-spacing="17" fill="#1e3a5f">ENGINEERING</text>
</svg>